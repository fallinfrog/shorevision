name: Update lake data
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/regions.json", "tools/fetch_lakes.py", ".github/workflows/lake-data.yml"]
  schedule:
    - cron: "17 9 * * 1"   # weekly refresh, Mondays
permissions:
  contents: write
concurrency:
  group: lake-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/fetch_lakes.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update lake data"
          git pull --rebase origin main
          git push
